name: SDD
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  policy:
    name: SDD Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/requirements.txt
      - name: Validate PR traceability and readiness
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tooling/sdd.py check --event "$GITHUB_EVENT_PATH" --base "$BASE_SHA"
      - name: Verify linked GitHub Issue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tooling/verify_issue.py "$GITHUB_EVENT_PATH"
      - name: Validate repository specifications
        if: github.event_name != 'pull_request'
        run: python tooling/sdd.py check
  tooling:
    name: SDD Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/requirements.txt
      - run: python tooling/sdd.py sync-agents --check
      - run: python tooling/verify_vendor.py
      - run: python -m unittest discover -s tooling/tests -v
