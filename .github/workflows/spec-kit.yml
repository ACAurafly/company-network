name: Spec Kit workflow

on:
  workflow_dispatch:
  push:
    paths:
      - ".specify/**"
      - ".agents/skills/speckit-*/**"
      - "tooling/local_sdd.py"
      - "tooling/local_speckit/**"
      - "tooling/requirements-speckit.txt"
      - "tooling/tests/test_local_sdd.py"
      - ".github/workflows/spec-kit.yml"
  pull_request:
    paths:
      - ".specify/**"
      - ".agents/skills/speckit-*/**"
      - "tooling/local_sdd.py"
      - "tooling/local_speckit/**"
      - "tooling/requirements-speckit.txt"
      - "tooling/tests/test_local_sdd.py"
      - ".github/workflows/spec-kit.yml"

permissions:
  contents: read

jobs:
  workflow-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tooling/requirements-speckit.txt
      - run: python -m unittest discover -s tooling/tests -p test_local_sdd.py -v
